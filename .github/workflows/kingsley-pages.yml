name: kingsley-pages

on:
  push:
    branches: [main]
    paths:
      - "kingsley/static/**"
      - ".github/workflows/kingsley-pages.yml"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - name: Configure Pages
        uses: actions/configure-pages@v5
      - name: Upload console
        uses: actions/upload-pages-artifact@v3
        with:
          path: kingsley/static
      - id: deployment
        name: Deploy
        uses: actions/deploy-pages@v4
